# Source registry — the whole ingest surface as configuration.
#
# Adding a source is an entry here, not a new Python module. Four adapters in
# scripts/adapters/ read this file and do the work. See SPEC.md §5.4.
#
# role:
#   primary  — produces citable records. An item's `sources` link points here.
#   signal   — produces sightings only. Credited, never republished. Its value
#              is corroboration: how many independent trackers flagged this,
#              and how fast. See SPEC.md §5.0 and §5.3.
#
# weight: contribution to salience (SPEC.md §5.3). Higher = a sighting here is
#   stronger evidence something matters. Calibrate against observed lead time
#   once the pipeline has run a few weeks — these are opening estimates, not
#   measurements.
#
# extract: which identifier patterns the resolver should look for. Narrowing
#   this is a precision lever; a US-only tracker should not be scanned for
#   CELEX numbers.
#
# corpus: items (default) | intelligence  — see SPEC.md §5.5
#
# status: active | queued | paid
#   queued = in the Coverage Gaps list, approved but not yet wired.
#   paid   = requires a subscription; a partnership decision, not an eng task.

meta:
  version: 3
  reviewBudgetPerWeek: 25          # drives the salience cutoff — SPEC.md §5.3
  defaultCadence: weekly

# ---------------------------------------------------------------------------
# Primary sources — records. Build these first (SPEC.md §5.4, sequencing rule).
# ---------------------------------------------------------------------------

sources:
  - id: courtlistener-dockets
    name: CourtListener / RECAP — dockets
    category: primary-us
    adapter: api
    role: primary
    weight: 1.0
    cadence: weekly
    status: active
    extract: [us_docket, case_caption]
    config:
      base: https://www.courtlistener.com/api/rest/v4
      type: r
      rateLimitPerMin: 5           # measured, not documented — SPEC.md §5.9
      # Stream 1: validated 43 hits/90d at ~100% precision
      queries:
        - 'caseName:("OpenAI" OR "Anthropic" OR "Stability AI" OR "Midjourney"
           OR "Perplexity" OR "Character Technologies" OR "Clearview AI")'

  - id: courtlistener-opinions
    name: CourtListener — opinion full text
    category: primary-us
    adapter: api
    role: primary
    weight: 1.0
    cadence: weekly
    status: active
    extract: [us_docket, case_caption]
    config:
      base: https://www.courtlistener.com/api/rest/v4
      type: o
      rateLimitPerMin: 5
      # Stream 2. Works but appellate-skewed; Charlotin covers this better.
      # Quoted phrases do real phrase matching — SPEC.md §5.9.
      queries:
        - '("artificial intelligence" OR "ChatGPT" OR "generative AI") AND
           ("fabricated citation" OR "nonexistent case" OR "hallucinated")'

  - id: federal-register
    name: Federal Register
    category: primary-us
    adapter: api
    role: primary
    weight: 1.0
    cadence: daily
    status: queued
    extract: [fr_docnum, rin]
    config:
      base: https://www.federalregister.gov/api/v1

  - id: regulations-gov
    name: Regulations.gov
    category: primary-us
    adapter: api
    role: primary
    weight: 0.8
    cadence: weekly
    status: queued
    extract: [fr_docnum, rin, docket_id]
    notes: Public comment dockets reveal industry posture before final rules.

  - id: openstates
    name: Open States — US state legislation
    category: primary-us
    adapter: api
    role: primary
    weight: 0.9
    cadence: weekly
    status: queued
    extract: [us_state_bill]

  - id: eurlex
    name: EUR-Lex
    category: primary-eu
    adapter: api
    role: primary
    weight: 1.0
    cadence: weekly
    status: queued
    extract: [celex]
    notes: >
      CELEX numbers are the cleanest dedup keys in the whole system. A White &
      Case post, a DLA Piper summary, and the EUR-Lex record all resolve to the
      same key with no heuristics. See SPEC.md §5.2.

  - id: legislation-gov-uk
    name: legislation.gov.uk
    category: primary-uk
    adapter: api
    role: primary
    weight: 1.0
    cadence: weekly
    status: queued
    extract: [uk_uri]

  - id: bailii
    name: BAILII — UK/Ireland case law
    category: primary-uk
    adapter: sitemap
    role: primary
    weight: 0.9
    cadence: weekly
    status: queued
    extract: [uk_neutral_citation, case_caption]
    notes: Primary source for Ayinde, Al-Haroun, Harber, Getty UK.

  - id: gesetze-im-internet
    name: Gesetze im Internet (DE)
    category: primary-de
    adapter: sitemap
    role: primary
    weight: 0.9
    cadence: monthly
    status: queued
    extract: [de_shorttitle]
    notes: Authoritative German statute citations for the German client base.

  - id: eu-ai-office
    name: EU AI Office (DG CNECT)
    category: primary-eu

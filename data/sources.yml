    notes: GPAI Code of Practice, delegated acts, interpretive guidance.

  - id: charlotin
    name: Charlotin AI Hallucination Cases
    category: sanctions
    adapter: manual
    role: primary
    weight: 1.0
    cadence: monthly
    status: active
    extract: [us_docket, case_caption]
    notes: >
      ~1,980 cases, near-total recall on the sanctions lane. Obviates building
      our own detector — SPEC.md §5.8. Manual CSV export until an API exists.

